# Run the app: make run (podman-compose; or COMPOSE="docker compose")
# Vue editor + API proxy: http://localhost:8081 (override with WEB_PORT).

services:
  app:
    build: .
    image: localhost/spellcheck
    environment:
      SPELL_DEFAULT_LANGUAGE: ${SPELL_DEFAULT_LANGUAGE:-en-US}
      SPELL_MAX_WORD_LEN: ${SPELL_MAX_WORD_LEN:-64}
      SPELL_MAX_WORDS: ${SPELL_MAX_WORDS:-500}
      SPELL_MAX_BODY_BYTES: ${SPELL_MAX_BODY_BYTES:-385564}
      SPELL_MAX_SUGGESTIONS: ${SPELL_MAX_SUGGESTIONS:-5}
      SPELL_MAX_DISTANCE: ${SPELL_MAX_DISTANCE:-2}
      SPELL_PREFIX_LENGTH: ${SPELL_PREFIX_LENGTH:-7}
    # The API is private; the editor reaches it through nginx.
    restart: unless-stopped
  web:
    build: ./web
    image: localhost/spellcheck-editor
    depends_on:
      - app
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    restart: unless-stopped
